name: Add IPTV Playlist

on:
  workflow_dispatch:
    inputs:
      m3u_url:
        description: 'رابط قائمة M3U'
        required: true
        type: string
      playlist_name:
        description: 'اسم القائمة'
        required: false
        default: 'My Playlist'
        type: string

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Execute Automation Script
        env:
          M3U_URL: ${{ inputs.m3u_url }}
          PLAYLIST_NAME: ${{ inputs.playlist_name }}
          MAC_ADDRESS: "F8:01:B4:8C:AF:20"
        run: python add_playlist.py
